name: WhatsApp complaint Worker and UI tests

on:
  push:
    branches:
      - feature/whatsapp-message-optimization
      - feature/supervisor-resident-flat-management
      - feature/web-chat-complaint-backup
      - feature/web-complaint-whatsapp-ui-redesign
    paths:
      - 'workers/complaint-bot/worker.js'
      - 'workers/complaint-bot/wrangler.jsonc'
      - 'workers/complaint-bot/worker.optimization.test.mjs'
      - 'workers/complaint-bot/worker.web-chat.test.mjs'
      - 'src/WebComplaintChat.jsx'
      - 'src/WebComplaintChat.css'
      - 'scripts/verify-webchat-css.mjs'
      - 'src/main.jsx'
      - 'vite.config.js'
      - 'src/ResidentFlatManagement.jsx'
      - 'src/ResidentFlatManagement.css'
      - 'src/App.jsx'
      - 'src/ComplaintLiveDisplay.jsx'
      - '.github/workflows/whatsapp-message-optimization-tests.yml'
  pull_request:
    paths:
      - 'workers/complaint-bot/worker.js'
      - 'workers/complaint-bot/wrangler.jsonc'
      - 'workers/complaint-bot/worker.optimization.test.mjs'
      - 'workers/complaint-bot/worker.web-chat.test.mjs'
      - 'src/WebComplaintChat.jsx'
      - 'src/WebComplaintChat.css'
      - 'scripts/verify-webchat-css.mjs'
      - 'src/main.jsx'
      - 'vite.config.js'
      - 'src/ResidentFlatManagement.jsx'
      - 'src/ResidentFlatManagement.css'
      - 'src/App.jsx'
      - 'src/ComplaintLiveDisplay.jsx'
      - '.github/workflows/whatsapp-message-optimization-tests.yml'

permissions:
  contents: read

jobs:
  worker-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Worker web-complaint configuration
        run: |
          node -e "const fs=require('node:fs');const assert=require('node:assert/strict');const c=JSON.parse(fs.readFileSync('workers/complaint-bot/wrangler.jsonc','utf8'));assert.equal(c.keep_vars,true);assert.equal(c.vars.WEB_TURNSTILE_HOSTNAMES,'rwa-ai.pages.dev');assert.equal(c.vars.WEB_COMPLAINT_PUBLIC_URL,'https://rwa-ai.pages.dev/?view=complaint-chat');assert.equal(c.WEB_TURNSTILE_SECRET_KEY,undefined);assert.equal(c.vars.WEB_TURNSTILE_SECRET_KEY,undefined);"
      - name: Run simulated WhatsApp and Supabase tests
        run: node --test workers/complaint-bot/worker.optimization.test.mjs workers/complaint-bot/worker.web-chat.test.mjs

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify supervisor UI production build
        run: npm run build
      - name: Confirm public chat CSS is linked from the entry HTML
        run: node scripts/verify-webchat-css.mjs
